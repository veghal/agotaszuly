<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agota Szuly</title>
  <style>
    :root {
      --background: #ffffff;
      --text: #1a1a1a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #16181d;
        --text: #f2f2f2;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    h1 {
      margin: 0;
      padding: 1rem;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Agota Szuly</h1>
</body>
</html>
